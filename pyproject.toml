[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-loop"
version = "0.1.0"
description = "Planner/worker/reviewer autonomous implementation/review loop for Cursor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<14",
    "typer>=0.12,<1",
    "psutil>=6.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.8,<1",
]

[project.scripts]
auto-loop = "auto_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_loop"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"

[tool.hatch.build.targets.sdist]
include = ["src/auto_loop", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src"]
markers = [
    "live_cursor: opt-in real Cursor smoke test (requires AUTO_LOOP_LIVE_CURSOR=1 and CLI auth).",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit pre-0.16 default set. Ruff 0.16 enables 400+ rules by default; this
# project only configured line-length/target-version and is not clean against
# that expansion. Keep a stable CI gate (syntax, pyflakes) without a repo-wide
# style rewrite.
select = ["E4", "E7", "E9", "F"]
