# Auto Loop run manifest (version 2).
# Pass this file to the CLI: auto-loop run PATH/TO/THIS.yaml
#
# workspace is resolved relative to this file's directory.
# All other paths are resolved relative to workspace.

version: 2
workspace: {{workspace}}

task:
  source: {{task_source}}

artifacts:
  root: {{artifacts_root}}

models:
  planner: auto
  worker: auto
  reviewer: auto

run:
  max_turns: 100
  max_runtime_minutes: 480
