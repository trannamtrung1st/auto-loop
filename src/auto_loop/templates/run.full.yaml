# Auto Loop run manifest — full public reference (version 2).
# Generated by: auto-loop init PATH --full
#
# Pass this file to every CLI command:
#   auto-loop doctor PATH
#   auto-loop run PATH
#   auto-loop resume PATH
#
# Path rules:
# - workspace is resolved relative to this YAML file's directory.
# - task.source, artifacts.root, context paths, instruction files, and protection
#   paths are resolved relative to workspace unless absolute.
# - User-owned: this YAML, task.source, optional context/instruction files.
# - Tool-managed: everything under artifacts.root (plan, reviews, runtime state).

version: 2

# Repository root Auto Loop may modify.
workspace: {{workspace}}

task:
  # User-owned goal/task document (copied to artifacts.root/task.md on run start).
  source: {{task_source}}

artifacts:
  # Generated plan, reviews, and runtime state. Must stay inside workspace.
  root: {{artifacts_root}}

# Model selection — one place for all roles (do not set agents.*.model).
models:
  planner: auto
  worker: auto
  reviewer: auto

# Run limits and timeouts — canonical public settings (do not use top-level limits:).
run:
  max_turns: 100
  max_runtime_minutes: 480
  agent_timeout_seconds: 3600
  agent_idle_timeout_seconds: 300
  provider_retries: 2
  protocol_retries: 1
  max_consecutive_worker_no_progress: 3

provider:
  type: cursor
  cursor:
    # CLI binary: agent | cursor-agent
    command: agent
    planner_extra_args:
      - --force
    worker_extra_args:
      - --force
    reviewer_extra_args: []

# Per-role advanced behavior only (role_file, mode). Models come from models.* above.
agents:
  planner:
    role_file: ""
    mode: agent
  worker:
    role_file: ""
    mode: agent
  reviewer:
    role_file: ""
    mode: ask

instructions:
  # mode: extend | replace_role
  shared:
    mode: extend
    files: []
  planner:
    mode: extend
    files: []
  worker:
    mode: extend
    files: []
  reviewer:
    mode: extend
    files: []

context:
  version: 1
  shared:
    resources: []
    # Example:
    # resources:
    #   - path: README.md
    #     purpose: Project overview
    #     required: true
    skills: []
    # Example:
    # skills:
    #   - path: .agents/skills/testing
    #     purpose: Testing workflow
    #     required: false
  planner:
    resources: []
    skills: []
  worker:
    resources: []
    skills: []
  reviewer:
    resources: []
    skills: []

git:
  # required: clean commits and Git ranges are mandatory review evidence.
  # optional: Git is used when present; path and content targets are enough without a commit.
  # off: do not use Git. Review explicit targets only.
  # Quote off if you select it: mode: "off" (unquoted off is also accepted).
  mode: optional
  # When an approved Git head exists, refuse history rewrites that orphan it.
  protect_approved_history: true

protection:
  product_exclude: []
  protected_files: []

logging:
  # console: quiet | normal | verbose
  console: normal
  retain_raw_streams: true
  max_run_history: 20
